apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileserver-deployment
  namespace: fileserver
  labels:
    app: fileserver

spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fileserver

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: fileserver

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: fileserver
        image: sre-f26-fileserver:local
        imagePullPolicy: IfNotPresent
        args:
        - serve

        envFrom:
        - configMapRef:
            name: fileserver-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fileserver-secret
              key: DATABASE_URL
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-secret
              key: S3_SECRET_KEY

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        ports:
        - name: http
          containerPort: 8080

        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30

        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2

      enableServiceLinks: false
