data_dir: /var/lib/vector
sources:
  fileserver:
    type: kubernetes_logs
    self_node_name: ${VECTOR_SELF_NODE_NAME}
    extra_field_selector: metadata.namespace=fileserver
    extra_label_selector: app=fileserver
    glob_minimum_cooldown_ms: 1000
transforms:
  application_json:
    type: remap
    inputs: [fileserver]
    source: |
      app, err = parse_json(.message)
      if err == null && is_object(app) {
        . = merge!(., app)
      }
      # Keep unexpected non-JSON lines too, e.g. a Go runtime diagnostic.
      ."service.name" = "fileserver"
      if !exists(.level) { .level = "info" }
      del(.source_type)
sinks:
  victorialogs:
    type: elasticsearch
    inputs: [application_json]
    endpoints: [http://victorialogs.observability.svc.cluster.local:9428/insert/elasticsearch/]
    api_version: v8
    mode: bulk
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: service.name,kubernetes.pod_namespace,kubernetes.container_name
    batch:
      timeout_secs: 1
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
