apiVersion: 1
datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs.observability.svc.cluster.local:9428
    isDefault: true
    editable: false
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://vmsingle-nodeport.observability.svc.cluster.local:8428
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
