image:
  tag: "13.1.0"

replicas: 1

deploymentStrategy:
  type: Recreate

service:
  type: ClusterIP
  port: 3000

rbac:
  create: false

automountServiceAccountToken: false

securityContext:
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

startupProbe:
  httpGet:
    path: /api/health
    port: grafana
  periodSeconds: 5
  failureThreshold: 60

env:
  GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.27.1
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
  GF_AUTH_DISABLE_LOGIN_FORM: "true"
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victorialogs.observability.svc.cluster.local:9428
        isDefault: true
        editable: false

      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server.observability.svc.cluster.local:8428
        editable: false
        jsonData:
          timeInterval: 15s
          httpMethod: POST

dashboardProviders:
  providers.yaml:
    apiVersion: 1
    providers:
      - name: fileserver
        orgId: 1
        folder: FileServer
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/fileserver
