apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: grafana-datasources
    files:
      - victorialogs.yaml=grafana-datasources.yaml
  - name: grafana-dashboards
    files:
      - dashboards.yaml=grafana-dashboards.yaml
  - name: fileserver-logs-dashboard
    files:
      - fileserver-logs.json=dashboards/fileserver-logs.json
