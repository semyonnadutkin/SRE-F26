apiVersion: v1
kind: Service
metadata:
  name: s3-headless
  namespace: fileserver
  labels:
    app: s3
spec:
  selector:
    app: s3
  ports:
  - name: s3
    port: 8333
    targetPort: s3
  - name: master
    port: 9333
    targetPort: master
  - name: master-grpc
    port: 19333
    targetPort: master-grpc
  - name: volume
    port: 8080
    targetPort: volume
  - name: volume-grpc
    port: 18080
    targetPort: volume-grpc
  - name: filer
    port: 8888
    targetPort: filer
  - name: filer-grpc
    port: 18888
    targetPort: filer-grpc
  clusterIP: None
  publishNotReadyAddresses: true
