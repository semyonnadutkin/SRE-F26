apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fileserver
  labels:
    app: postgres

spec:
  serviceName: postgres-headless
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: postgres
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432

        envFrom:
        - configMapRef:
            name: postgres-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi

        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 60

        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      enableServiceLinks: false

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
