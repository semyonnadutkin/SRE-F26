apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fileserver
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_POSTGRES_PASSWORD
  DATABASE_URL: postgres://fileserver:REPLACE_WITH_POSTGRES_PASSWORD@127.0.0.1:5432/fileserver?sslmode=disable
